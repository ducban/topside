<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Topside's icon: one split-flap tile showing T, as on the board, on the night plate.
       The source for every icon size: scripts/make-brand.sh renders it. Full bleed;
       macOS's 824 pt grid and shadow are added when the Mac PNG is drawn. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e4d"/>
      <stop offset="1" stop-color="#0d0f1c"/>
    </linearGradient>
    <linearGradient id="upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#363841"/>
      <stop offset="1" stop-color="#2a2c33"/>
    </linearGradient>
    <linearGradient id="lower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22242a"/>
      <stop offset="1" stop-color="#1a1b20"/>
    </linearGradient>
    <clipPath id="tile"><rect x="212" y="162" width="600" height="700" rx="64"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="231" fill="url(#sky)"/>
  <!-- The axle the flaps turn on, peeking out at both sides. -->
  <rect x="190" y="490" width="644" height="44" rx="10" fill="#3b3e48"/>
  <g clip-path="url(#tile)">
    <rect x="212" y="162" width="600" height="350" fill="url(#upper)"/>
    <rect x="212" y="512" width="600" height="350" fill="url(#lower)"/>
    <!-- The letter: amber on the upper flap, a shade deeper on the lower one. -->
    <rect x="322" y="262" width="380" height="112" fill="#f5c84b"/>
    <rect x="454" y="374" width="116" height="138" fill="#f5c84b"/>
    <rect x="454" y="512" width="116" height="250" fill="#d9a92b"/>
    <!-- The hinge: the gap between the two flaps. -->
    <rect x="212" y="503" width="600" height="18" fill="#0a0b0e"/>
  </g>
</svg>
