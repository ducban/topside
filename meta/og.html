<!doctype html>
<!-- The source of og.png: open at 1200 by 630 and take a screenshot (see README). -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400&display=swap">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: radial-gradient(120% 100% at 50% 0%, #1a2140 0%, #0b0d14 62%); color: #e6e2d8; font-family: "IBM Plex Mono", monospace; position: relative; }
.pill { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 520px; height: 56px; background: #000; border-radius: 0 0 26px 26px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 26px; box-sizing: border-box; }
/* The board's pill: the newest agent as a flight code, a flap per session. */
.flaps { display: flex; gap: 3px; }
.flaps i { position: relative; font: 700 22px/32px "IBM Plex Mono", monospace; font-style: normal; width: 22px; height: 32px; text-align: center;
  background: linear-gradient(#2c2e35 50%, #202227 50%); border-radius: 3px; }
.flaps i::after { content: ""; position: absolute; left: 0; right: 0; top: 15.5px; height: 1px; background: #0a0b0e; }
.flaps.small i { font-size: 18px; line-height: 27px; width: 19px; height: 27px; }
.flaps.small i::after { top: 13px; }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; padding-top: 20px; }
.logotype { width: 620px; height: auto; }
h1 { font: 400 58px/1 "Newsreader", serif; margin: 0; letter-spacing: -.01em; }
.agents { font-size: 22px; color: #969186; }
.url { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; font-size: 20px; color: #969186; }
</style></head><body>
<div class="pill"><span class="flaps"><i style="color:#ff8c29">C</i><i style="color:#ff8c29">L</i><i style="color:#ff8c29">D</i></span><span class="flaps small"><i style="color:#ff8c29">W</i><i style="color:#4d85ff">B</i><i style="color:#40d96b">A</i><i style="color:#8e94a6">P</i><i style="color:#4d85ff">B</i></span></div>
<div class="center"><img class="logotype" src="../img/topside-logo.svg" alt="Topside"><h1>Every agent, one notch.</h1>
<div class="agents">Claude Code · Codex CLI · pi · omp · OpenCode</div></div>
<div class="url">topside.ducban.com</div>
</body></html>
